# Optional control-plane bootstrap settings. Workflows, repositories, and
# Automations are created in the Factory UI and stored in SQLite.
listen = "127.0.0.1:7337"
database = "server/factory.sqlite3"
default_build_runtime = "codex"

# Optional remote VM Worker endpoint. Configure all three values together.
# worker_listen = "0.0.0.0:7443"
# worker_tls_cert = "/etc/factory/tls/server.crt"
# worker_tls_key = "/etc/factory/tls/server.key"

# Optional public GitHub webhook endpoint. Configure all four values together.
# webhook_listen = "0.0.0.0:7444"
# webhook_tls_cert = "/etc/factory/tls/server.crt"
# webhook_tls_key = "/etc/factory/tls/server.key"
# github_webhook_secret_file = "/etc/factory/github-webhook-secret"
