[server]
listen = "127.0.0.1:7331"
database = "~/.machinist/server/machinist.db"
worker_token_file = "~/.machinist/server/worker.token"

[agents.foreman]
executor = "codex"
prompt_file = "agents/foreman.md"
timeout = "120m"

[agents.audit]
executor = "codex"
prompt_file = "agents/audit.md"
timeout = "60m"

[agents.shepherd]
executor = "codex"
prompt_file = "agents/shepherd.md"
timeout = "120m"

# Opt in one configured repository by adding a schedule like this:
# [shepherd.my-project]
# repository = "my-project"
# every = "30m"
# max_actions = 3
