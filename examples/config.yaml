server:
  listen: 127.0.0.1:7331
  # public_url: https://machinist.example.com
  # Relative paths are read from this file's directory. Machinist writes its
  # state under .machinist/, which init adds to .gitignore.
  database: .machinist/tickets.db
  factory: factory
  default_preset: default
  run_timeout: 60m
  # tls_cert: /etc/machinist/tls.crt
  # tls_key: /etc/machinist/tls.key

# The control plane reads its GitHub token from GH_TOKEN, unless a GitHub App is
# set. With an app, each run gets a token for its own repository that lasts an
# hour, and no runner needs GH_TOKEN. See docs/github-app.md.
github:
  handle: machinist-bot
  repositories: []
  # Auto-merge low-risk pull requests once checks pass, review accepts, and
  # merge-gate approves. Set false for observe mode (merge-gate still comments
  # its verdict without merging).
  auto_merge: true
  # Automatic PR Steward retries when a pull request fails CI or hits a merge
  # conflict (0 disables, max 5).
  steward_retries: 2
  # app:
  #   id: 123456
  #   private_key_file: .machinist/github-app.pem

# Start jobs from GitHub Issues by applying a label. Off until allowed_users is
# set. Uses github.app installation tokens when configured, or GH_TOKEN.
# github_issues:
#   label: machinist
#   allowed_users: [<your GitHub login>]
#   # repositories: [owner/name]   # optional subset of github.repositories
#   # preset: default              # optional; defaults to server.default_preset
#   # in_progress_label: in-progress
#   poll_seconds: 60
#   max_jobs_per_hour: 10

# Start jobs from Linear. Off until projects or teams is set. The app signs in
# with LINEAR_CLIENT_ID and LINEAR_CLIENT_SECRET from the environment, never
# this file. Machinist polls every poll_interval. See docs/linear.md.
# linear:
#   app_user_id: <the Machinist app's Linear user ID>
#   allowed_users: [<your Linear user ID>]
#   projects:            # project name or ID to repository; wins over teams
#     Machinist: owner/name
#   teams:               # team key to repository, for other projects
#     ENG: owner/name
#   poll_interval: 60s
#   max_jobs_per_hour: 20

# Post one JSON message to a webhook (such as a Slack incoming webhook) when a
# job opens a pull request that waits for a person, or fails.
# notify:
#   webhook: https://hooks.slack.com/services/...
