server:
  listen: 127.0.0.1:7331
  # Relative paths are read from this file's directory. Machinist writes its
  # state under .machinist/, which init adds to .gitignore.
  database: .machinist/tickets.db
  factory: factory
  default_preset: default
  run_timeout: 60m
  # tls_cert: /etc/machinist/tls.crt
  # tls_key: /etc/machinist/tls.key

# The control plane reads its GitHub token from GH_TOKEN.
github:
  handle: machinist-bot
  repositories: []

# Start jobs from Linear. Off until teams is set. The signing secret is read
# from LINEAR_WEBHOOK_SECRET. See docs/linear.md.
# linear:
#   app_user_id: <the Machinist app's Linear user ID>
#   preset: coding
#   teams:
#     ENG: owner/name
#   max_jobs_per_hour: 20
