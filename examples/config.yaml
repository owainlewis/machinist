server:
  listen: 127.0.0.1:7331
  # Relative paths are read from this file's directory. Machinist writes its
  # state under .machinist/, which init adds to .gitignore.
  database: .machinist/tickets.db
  factory: factory
  default_preset: default
  run_timeout: 60m
  # tls_cert: /etc/machinist/tls.crt
  # tls_key: /etc/machinist/tls.key

# The control plane reads its GitHub token from GH_TOKEN, unless a GitHub App is
# set. With an app, each run gets a token for its own repository that lasts an
# hour, and no runner needs GH_TOKEN. See docs/github-app.md.
github:
  handle: machinist-bot
  repositories: []
  # app:
  #   id: 123456
  #   private_key_file: .machinist/github-app.pem
