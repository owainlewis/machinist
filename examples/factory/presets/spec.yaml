# Turn a rough request into a spec for a coding job. It reads the repository and
# changes nothing. The spec is the job's result: edit it, then start a coding job
# with it as the prompt.
timeout: 20m

steps:
  - name: checkout
    timeout: 5m
    run: gh repo clone "$MACHINIST_REPO" . -- --quiet

  - name: spec
    run: |
      agent.sh spec
      test -s "$MACHINIST_DIR/result.md"
