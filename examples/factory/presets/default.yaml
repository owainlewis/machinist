# A one-off job: clone the repository, let an agent do what the prompt asks,
# then open a pull request, wait for its checks and merge it. Every job uses
# this preset unless it names another.
#
# A step either runs shell (run:) or one of the agents in factory/agents
# (agent:). Steps run in order in one workspace, and the first that fails
# ends the job. Scripts in factory/scripts are on PATH.
description: Clone the repository, have an agent make the change, open a pull request and merge it once its checks pass.
timeout: 60m

steps:
  - name: checkout
    timeout: 5m
    run: checkout.sh

  - name: implement
    agent: implement

  # factory/agents/publish.md says how the change ships. Edit it to change
  # the pull request or how it merges.
  - name: publish
    timeout: 30m
    agent: publish
