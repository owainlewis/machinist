# Clone the repository, let Claude Code do the work, and open one pull request.
# Each run is a shell command, run with sh -e in one workspace, in order. The
# first that fails ends the job. Scripts in factory/scripts are on PATH, and
# factory/prompts is in $MACHINIST_DIR/prompts.
timeout: 60m

steps:
  - name: checkout
    timeout: 5m
    run: checkout.sh

  - name: work
    run: agent.sh work

  - name: publish
    timeout: 5m
    run: publish.sh
