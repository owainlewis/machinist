# A one-off job: clone the repository, have an agent make the change, have
# another review it and fix what the review found, then open a pull request
# and merge it once its checks pass. Every job uses this preset unless it
# names another.
#
# A step either runs shell (run:) or one of the agents in factory/agents
# (agent:). Steps run in order in one workspace, and the first that fails
# ends the job. Scripts in factory/scripts are on PATH.
description: Clone the repository, have an agent make the change, review it and fix what the review found, then open a pull request and merge it once its checks pass.
timeout: 60m

steps:
  - name: checkout
    timeout: 5m
    run: checkout.sh

  - name: implement
    agent: implement

  # Runs agents/review.md, which writes review.json: accepted,
  # revision_needed or human_decision_needed.
  - name: review
    timeout: 15m
    run: review.sh

  # When the review asks for a revision, runs agents/revise.md and then
  # reviews the change again. Otherwise it does nothing.
  - name: revise
    run: revise.sh

  # Pushes the branch, then runs agents/publish.md to open the pull request.
  # A push GitHub rejects fails the job. A job with no commits pushes nothing.
  - name: publish
    timeout: 10m
    run: publish.sh

  # Merges only when github.auto_merge is on, the review accepted the change
  # and every check passed. This is code, not an agent.
  - name: merge
    timeout: 30m
    run: machinist merge
