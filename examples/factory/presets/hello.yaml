# A smoke test. It proves the control plane and a runner work together without
# cloning a repository or running an agent. Start a job with "preset": "hello".
timeout: 5m

steps:
  - name: hello
    run: |
      echo "Job $MACHINIST_JOB_ID for $MACHINIST_REPO on branch $MACHINIST_BRANCH"
      echo "The prompt starts:"
      head -n 1 "$MACHINIST_DIR/prompt.md"

  - name: finish
    run: |
      echo "Hello from Machinist." > "$MACHINIST_DIR/result.md"
