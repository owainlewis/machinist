# Plan, build, test, review, fix, test again, and open one pull request. Steps
# hand work on through files in $MACHINIST_DIR, which is outside the clone, so
# none of them is committed.
timeout: 90m

steps:
  - name: checkout
    timeout: 5m
    run: checkout.sh

  - name: plan
    timeout: 20m
    run: |
      agent.sh plan
      test -s "$MACHINIST_DIR/question.md" || test -s "$MACHINIST_DIR/plan.md"

  - name: implement
    run: agent.sh implement

  - name: test
    timeout: 20m
    run: test.sh

  - name: review
    timeout: 20m
    run: |
      agent.sh review
      test -s "$MACHINIST_DIR/review.md"

  - name: fix
    run: agent.sh fix

  - name: retest
    timeout: 20m
    run: test.sh

  - name: publish
    timeout: 5m
    run: publish.sh
