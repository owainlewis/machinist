# A local runner. Start it with: machinist runner start
control_plane: http://127.0.0.1:7331
token_file: .machinist/runner.token
data_directory: .machinist/runner
slots: 2

# Without a GitHub App on the control plane, the runner needs GH_TOKEN, for a
# GitHub login that belongs to the bot. Steps get it as GH_TOKEN, scoped to the
# job's repository. With an app, each run brings its own token instead.

# Variables passed from the runner's environment to every step.
env: [ANTHROPIC_API_KEY]

# Give steps your home directory, so a tool can use a login you already have.
# This is for your own machine only.
# login: true

# Add this block to run each job in a hardened, ephemeral Docker container.
# Set runtime: runsc to run containers under gVisor on Linux.
# docker:
#   image: ghcr.io/owainlewis/machinist-runner:latest
#   runtime: ""
#   network: ""
#   proxy_url: ""
#   memory: "4g"
#   cpus: 2
#   pids_limit: 512
#   env: [ANTHROPIC_API_KEY]

