apiVersion: v1
kind: Namespace
metadata:
  name: machinist-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: machinist-state
  namespace: machinist-system
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 20Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: machinist-private-access
  namespace: machinist-system
spec:
  podSelector:
    matchLabels:
      app: machinist-control-plane
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: machinist-runner
      ports:
        - protocol: TCP
          port: 7341
---
apiVersion: v1
kind: Service
metadata:
  name: machinist-control-plane
  namespace: machinist-system
spec:
  selector:
    app: machinist-control-plane
  ports:
    - port: 7341
      targetPort: 7341
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: machinist-control-plane
  namespace: machinist-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: machinist-control-plane
  template:
    metadata:
      labels:
        app: machinist-control-plane
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: machinist
          image: machinist-control-plane
          # config.toml and the factory directory live on the state volume.
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: machinist-github
                  key: GH_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          startupProbe:
            exec:
              command: [python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7341/healthz', timeout=3).close()"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7341/healthz', timeout=3).close()"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7341/healthz', timeout=3).close()"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: state
              mountPath: /var/lib/machinist
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: machinist-state
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
