<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Machinist</title>
  <desc id="description">Assign the work. Get merged pull requests.</desc>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.75"><stop offset="0" stop-color="#4c6ef5" stop-opacity=".35"/><stop offset="1" stop-color="#4c6ef5" stop-opacity="0"/></radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6283ff"/><stop offset="1" stop-color="#4c6ef5"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#161618"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(556 110)">
    <rect width="88" height="88" rx="22" fill="url(#tile)"/>
    <g transform="scale(1.375)"><rect x="14" y="16" width="26" height="8" rx="4" fill="#fff" fill-opacity=".45"/><rect x="19" y="28" width="26" height="8" rx="4" fill="#fff" fill-opacity=".72"/><rect x="24" y="40" width="26" height="8" rx="4" fill="#fff"/></g>
  </g>
  <text x="600" y="318" text-anchor="middle" fill="#ececef" font-family="Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="650" letter-spacing="-2.5">A software factory that</text>
  <text x="600" y="396" text-anchor="middle" fill="#ececef" font-family="Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="650" letter-spacing="-2.5">runs on your own servers</text>
  <text x="600" y="470" text-anchor="middle" fill="#a1a1aa" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28">Open source. For teams and solo developers.</text>
  <text x="600" y="560" text-anchor="middle" fill="#8aa5ff" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600">machinist.sh</text>
</svg>
