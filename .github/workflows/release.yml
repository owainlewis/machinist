name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to use for a dry-run build, such as v0.1.0-test.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Confirm toolchain
        run: test "$(go env GOVERSION)" = "go1.26.6"
      - name: Verify release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/$RELEASE_VERSION")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_VERSION^{}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build release set
        run: bash scripts/release.sh "$RELEASE_VERSION" dist
      - name: Prove reproducible release set
        run: |
          bash scripts/release.sh "$RELEASE_VERSION" dist-repeat
          diff -qr dist dist-repeat
      - name: Verify release set
        run: bash scripts/verify-release.sh dist "$RELEASE_VERSION"
      - name: Upload release set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: machinist-release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: machinist-release-assets
          path: dist
      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes)
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_VERSION" dist/* \
            --title "Machinist $RELEASE_VERSION" \
            "${flags[@]}"
