name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: internal/controlplane/web/package-lock.json
      - name: Test Kubernetes deployment safety
        run: python3 -m unittest discover -s deploy/kubernetes -p 'test_*.py'
      - name: Test Cloud Run packaging safety
        run: python3 -m unittest discover -s deploy/cloudrun -p 'test_*.py'
      - name: Test issue triage
        run: node --test .github/scripts/issue-triage.test.cjs
      - name: Test release notes
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Confirm toolchain
        run: test "$(go env GOVERSION)" = "go1.26.6"
      - name: Install frontend dependencies
        working-directory: internal/controlplane/web
        run: npm ci
      - name: Test frontend
        working-directory: internal/controlplane/web
        run: npm test
      - name: Build frontend
        working-directory: internal/controlplane/web
        run: npm run build
      - name: Check tracked frontend is current
        run: |
          git diff --exit-code -- internal/controlplane/web/dist
          test -z "$(git status --porcelain --untracked-files=all -- internal/controlplane/web/dist)"
      - name: Check Go formatting
        shell: bash
        run: |
          gofmt -l $(git ls-files '*.go') | tee /tmp/unformatted-go-files
          test ! -s /tmp/unformatted-go-files
      - name: Run Go vet
        run: go vet ./...
      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Run Go tests with the race detector
        run: go test -race ./...
      - name: Build Machinist
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-X main.version=ci" -o bin/machinist ./cmd/machinist
          test -x bin/machinist
          test "$(bin/machinist version)" = "ci"

  macos:
    name: macOS checks
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Confirm toolchain
        run: test "$(go env GOVERSION)" = "go1.26.6"
      - name: Run Go tests with the race detector
        run: go test -race ./...
      - name: Build Machinist
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-X main.version=ci" -o bin/machinist ./cmd/machinist
          test -x bin/machinist
          test "$(bin/machinist version)" = "ci"

  postgres:
    name: PostgreSQL 16 tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: machinist
          POSTGRES_PASSWORD: machinist
          POSTGRES_DB: machinist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Run Go tests against PostgreSQL 16 with race detector
        env:
          TEST_POSTGRES_URL: postgres://machinist:machinist@127.0.0.1:5432/machinist_test?sslmode=disable
        run: go test -race ./internal/tickets/... ./internal/controlplane/...

  check:
    name: check
    if: always()
    needs:
      - linux
      - macos
      - postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every platform check
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: |
          test "$LINUX_RESULT" = success
          test "$MACOS_RESULT" = success
          test "$POSTGRES_RESULT" = success
