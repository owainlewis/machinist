name: Nightly prerelease

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-prerelease
  cancel-in-progress: false

jobs:
  prepare:
    name: Check for a new main revision
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select nightly version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          existing=$(git tag --points-at "$GITHUB_SHA" --list 'v0.0.0-nightly.*' | head -n 1)
          if [[ -n "$existing" ]]; then
            echo "publish=false" >>"$GITHUB_OUTPUT"
            echo "version=$existing" >>"$GITHUB_OUTPUT"
            echo "A nightly prerelease already exists for $GITHUB_SHA: $existing"
            exit 0
          fi

          timestamp=$(date -u +%Y%m%d%H%M)
          short_sha=${GITHUB_SHA:0:12}
          version="v0.0.0-nightly.$timestamp.$short_sha"
          echo "publish=true" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "Publishing $version for $GITHUB_SHA"

  build:
    name: Verify main and build release assets
    if: needs.prepare.outputs.publish == 'true'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: internal/controlplane/web/package-lock.json
      - name: Run the complete project check
        shell: bash
        run: |
          set -euo pipefail
          (cd internal/controlplane/web && npm ci && npm test && npm run build)
          git diff --exit-code -- internal/controlplane/web/dist
          test -z "$(git status --porcelain --untracked-files=all -- internal/controlplane/web/dist)"
          gofmt -l $(git ls-files '*.go') | tee /tmp/unformatted-go-files
          test ! -s /tmp/unformatted-go-files
          python3 -m unittest discover -s evals -p 'test_*.py'
          go vet ./...
          go test -race ./...
          go build ./...
      - name: Build release set
        run: bash scripts/release.sh "$RELEASE_VERSION" dist
      - name: Prove reproducible release set
        run: |
          bash scripts/release.sh "$RELEASE_VERSION" dist-repeat
          diff -qr dist dist-repeat
      - name: Verify release set
        run: bash scripts/verify-release.sh dist "$RELEASE_VERSION"
      - name: Upload release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: machinist-nightly-release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish installable prerelease
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: machinist-nightly-release-assets
          path: dist
      - name: Create GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --generate-notes \
            --title "Machinist $RELEASE_VERSION"
