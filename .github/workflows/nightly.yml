name: Nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Publish a nightly build even if main has not changed since the last nightly
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  build:
    name: Build nightly assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      should_publish: ${{ steps.plan.outputs.should_publish }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether to publish
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          short_sha=$(git rev-parse --short=7 HEAD)
          version=$(bash scripts/nightly-version.sh "" "$short_sha")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

          existing_sha=$(gh api "repos/$GH_REPO/releases?per_page=30" \
            --jq '[.[] | select(.draft == false and .prerelease == true and (.tag_name | contains("-nightly.")))][0].target_commitish // ""')
          existing_tag=$(gh api "repos/$GH_REPO/releases?per_page=30" \
            --jq '[.[] | select(.draft == false and .prerelease == true and (.tag_name | contains("-nightly.")))][0].tag_name // ""')

          if [[ "$FORCE_PUBLISH" != "true" && ( "$existing_sha" == "$commit" || "$existing_tag" == *".$short_sha" ) ]]; then
            echo "Nightly release $existing_tag already covers $commit; skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.plan.outputs.should_publish == 'true'
        with:
          go-version: 1.26.6
          cache: true
      - name: Confirm toolchain
        if: steps.plan.outputs.should_publish == 'true'
        run: test "$(go env GOVERSION)" = "go1.26.6"
      - name: Build release set
        if: steps.plan.outputs.should_publish == 'true'
        run: bash scripts/release.sh "${{ steps.plan.outputs.version }}" dist
      - name: Prove reproducible release set
        if: steps.plan.outputs.should_publish == 'true'
        run: |
          bash scripts/release.sh "${{ steps.plan.outputs.version }}" dist-repeat
          diff -qr dist dist-repeat
      - name: Verify release set
        if: steps.plan.outputs.should_publish == 'true'
        run: bash scripts/verify-release.sh dist "${{ steps.plan.outputs.version }}"
      - name: Upload nightly assets
        if: steps.plan.outputs.should_publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: machinist-nightly-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish nightly pre-release
    needs: build
    if: needs.build.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Write nightly release notes
        shell: bash
        run: |
          set -euo pipefail
          previous=$(bash scripts/previous-tag.sh "$RELEASE_VERSION" "$RELEASE_COMMIT")
          {
            echo "Automated nightly build of \`main\` at \`$RELEASE_COMMIT\`."
            echo ""
            echo "Install or upgrade with:"
            echo '```sh'
            echo "machinist update --nightly"
            echo '```'
            echo ""
            if [[ -n "$previous" ]]; then
              echo "## Changes since $previous"
              echo ""
              git log --no-merges --pretty=format:'- %s (%h)' "${previous}..${RELEASE_COMMIT}" || true
              echo ""
            fi
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: machinist-nightly-assets
          path: dist
      - name: Create nightly pre-release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_VERSION" dist/* \
            --prerelease \
            --target "$RELEASE_COMMIT" \
            --title "Machinist $RELEASE_VERSION (nightly)" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Prune old nightly pre-releases
        shell: bash
        run: |
          set -euo pipefail
          keep=14
          tags=$(gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq '[.[] | select(.draft == false and .prerelease == true and (.tag_name | contains("-nightly."))) | .tag_name] | .['"$keep"':][]')
          for old_tag in $tags; do
            echo "Pruning old nightly release: $old_tag"
            gh release delete "$old_tag" --cleanup-tag --yes || true
          done
